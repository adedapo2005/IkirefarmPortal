<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a5f3d" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>DAENEM Farms Employee Gateway</title>
    <script>
    (() => {
      const origFetch = window.fetch;
      window.fetch = async function(input, init) {
        const url = typeof input === 'string' ? input : (input?.url || '');

        // Base44 Entities Mocks
        if (url.includes('GatewayGlobalLocation') || url.includes('GatewayHeroAsset')) {
          return new Response(JSON.stringify([]), { status: 200, headers: { 'Content-Type': 'application/json' } });
        }

        if (url.includes('GatewaySettings')) {
          return new Response(JSON.stringify([{
            portal_theme: 'day',
            primary_design_day: 'editorial',
            front_page_style: 'standard',
            clock_glow_day: true,
            clock_glow_night: true,
            clock_design_day: 'chronograph',
            clock_design_night: 'carbon',
            clock_case_day: 'brushed',
            clock_case_night: 'stealth',
            farm_surface_day: 'eggshell',
            farm_surface_night: 'deep_slate',
            signin_surface_day: 'eggshell',
            signin_surface_night: 'deep_slate',
            global_surface_day: 'eggshell',
            global_surface_night: 'deep_slate',
            status_surface_day: 'eggshell',
            status_surface_night: 'deep_slate'
          }]), { status: 200, headers: { 'Content-Type': 'application/json' } });
        }

        if (url.includes('GatewayAuthConfig')) {
          return new Response(JSON.stringify([{
            show_legal_consent: true,
            signin_design: 'pavilion',
            material: 'glass',
            accent: 'jade',
            button_style: 'solid',
            animation_style: 'smooth',
            animation_intensity: 'subtle',
            density_desktop: 'comfortable',
            density_tablet: 'comfortable',
            presentation_desktop: 'standard',
            presentation_tablet: 'standard'
          }]), { status: 200, headers: { 'Content-Type': 'application/json' } });
        }

        if (url.includes('GatewayFarmWeatherConfig')) {
          return new Response(JSON.stringify([{
            location_name: 'Balogun-Ikire, Osun State, Nigeria',
            timezone: 'Africa/Lagos',
            latitude: 7.36,
            longitude: 4.18
          }]), { status: 200, headers: { 'Content-Type': 'application/json' } });
        }

        // Portal Health: All providers available
        if (url.includes('/api/portal/v69/health')) {
          return new Response(JSON.stringify({
            status: 'healthy',
            providers: {
              google: { available: true },
              microsoft: { available: true },
              whatsapp: { available: true },
              password: { available: true }
            }
          }), { status: 200, headers: { 'Content-Type': 'application/json' } });
        }

        if (url.includes('/api/portal/v69/me')) {
          return new Response(JSON.stringify({ error: 'unauthenticated' }), {
            status: 401, headers: { 'Content-Type': 'application/json' }
          });
        }

        // Auth Login submission
        if (url.includes('/api/portal/v69/auth/login')) {
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: 'DAENEM_SIGNIN_SUCCESS', role: 'owner', name: 'Adedapo Daenem' }, '*');
            }
            const target = window.top && window.top !== window ? window.top : window;
            target.location.assign('/app.html');
          } catch (e) {}
          return new Response(JSON.stringify({
            status: 'success',
            user: { id: 'usr-owner-1', username: 'owner', role: 'owner', displayName: 'Adedapo Daenem' }
          }), { status: 200, headers: { 'Content-Type': 'application/json' } });
        }

        // Live Weather Data (Farm Station + 6 World Cities)
        if (url.includes('/api/gateway/weather')) {
          const nowIso = new Date().toISOString();
          return new Response(JSON.stringify({
            state: 'connected',
            farm: {
              state: 'connected',
              provider: 'Connected Open-Meteo',
              fetched_at: nowIso,
              current: {
                temp_f: 79,
                feels_like_f: 87,
                condition: 'Cloudy',
                code: 'cloudy',
                humidity: 78,
                wind_mph: 8,
                wind_dir: 'SW',
                wind_dir_deg: 220,
                gust_mph: 11,
                precip_prob: 8,
                precip_in: 0.03,
                pressure_in: 29.89,
                vis_mi: 9.8,
                uv: 4
              },
              today: {
                high_f: 89,
                low_f: 75,
                condition: 'Cloudy',
                code: 'cloudy',
                precip_in: 0.03
              },
              daily: [
                { date: '2026-11-06', day: 'Today', high_f: 89, low_f: 75, condition: 'Cloudy', code: 'cloudy', precip_prob: 8 },
                { date: '2026-11-07', day: 'Sat', high_f: 90, low_f: 76, condition: 'Scattered Showers', code: 'rain', precip_prob: 45 },
                { date: '2026-11-08', day: 'Sun', high_f: 88, low_f: 75, condition: 'Thunderstorms', code: 'storm', precip_prob: 60 },
                { date: '2026-11-09', day: 'Mon', high_f: 90, low_f: 74, condition: 'Thunderstorms', code: 'storm', precip_prob: 55 }
              ],
              sun: [{ sunrise: '2026-11-06T05:31:00Z', sunset: '2026-11-06T17:21:00Z' }]
            },
            cities: [
              {
                id: 'toronto',
                state: 'connected',
                provider: 'Open-Meteo',
                current: { temp_f: 55, feels_f: 51, condition: 'Cloudy', code: 'cloudy', humidity: 76, wind_mph: 7, wind_dir_deg: 245, gust_mph: 9 },
                today: { high_f: 58, low_f: 47 }
              },
              {
                id: 'london',
                state: 'connected',
                provider: 'Open-Meteo',
                current: { temp_f: 50, feels_f: 49, condition: 'Partly Cloudy', code: 'partly_cloudy', humidity: 87, wind_mph: 1, wind_dir_deg: 25, gust_mph: 3 },
                today: { high_f: 53, low_f: 46 }
              },
              {
                id: 'newyork',
                state: 'connected',
                provider: 'Open-Meteo',
                current: { temp_f: 60, feels_f: 59, condition: 'Cloudy', code: 'cloudy', humidity: 82, wind_mph: 5, wind_dir_deg: 290, gust_mph: 8 },
                today: { high_f: 63, low_f: 52 }
              },
              {
                id: 'moscow',
                state: 'connected',
                provider: 'Open-Meteo',
                current: { temp_f: 33, feels_f: 26, condition: 'Cloudy', code: 'cloudy', humidity: 83, wind_mph: 6, wind_dir_deg: 340, gust_mph: 17 },
                today: { high_f: 37, low_f: 30 }
              },
              {
                id: 'tokyo',
                state: 'connected',
                provider: 'Open-Meteo',
                current: { temp_f: 57, feels_f: 53, condition: 'Clear', code: 'clear', humidity: 55, wind_mph: 4, wind_dir_deg: 335, gust_mph: 20 },
                today: { high_f: 62, low_f: 50 }
              },
              {
                id: 'beijing',
                state: 'connected',
                provider: 'Open-Meteo',
                current: { temp_f: 39, feels_f: 33, condition: 'Mostly Clear', code: 'clear', humidity: 61, wind_mph: 4, wind_dir_deg: 45, gust_mph: 9 },
                today: { high_f: 46, low_f: 34 }
              }
            ]
          }), { status: 200, headers: { 'Content-Type': 'application/json' } });
        }

        // Live News & Editorial
        if (url.includes('/api/gateway/news')) {
          const sourcesList = Array.from({ length: 27 }, (_, i) => ({
            id: 'src-' + i,
            name: ['Punch', 'BusinessDay', 'Vanguard', 'Guardian', 'TheCable', 'Premium Times', 'Tribune', 'Leadership', 'Nation', 'ThisDay', 'Daily Trust', 'Sun', 'Telegraph', 'Independent', 'Blueprint', 'Peoples Gazette', 'BusinessPost', 'Nairametrics', 'AgroNigeria', 'FarmingNews', 'PoultryWorld', 'Channels TV', 'Arise News', 'NTA', 'VON', 'NAN', 'DAENEM Dispatches'][i] || ('Source ' + i),
            state: 'connected'
          }));

          return new Response(JSON.stringify({
            state: 'connected',
            sources: sourcesList,
            latest: [
              {
                id: 'n1',
                title: 'Stay and build Nigeria, Mutfwang urges graduates',
                source: 'Punch',
                published: new Date().toISOString(),
                link: '#',
                category: 'LIVE WIRE',
                summary: 'Graduates are urged to embrace national development and food security.'
              },
              {
                id: 'n2',
                title: "10 key things to know about Justice Lifu's judgment affecting ADC, Atiku, Obi",
                source: 'Premium Times',
                published: new Date().toISOString(),
                link: '#',
                category: 'NATIONAL',
                summary: 'Legal analysis on governance continuity and rule of law in Nigeria.'
              }
            ],
            intelligence: {
              macro: [{ id: 'm1' }],
              poultry: [{ id: 'p1' }],
              grain: [{ id: 'g1' }],
              livestock: [{ id: 'l1' }],
              energy: [{ id: 'e1' }],
              policy: [{ id: 'po1' }]
            }
          }), { status: 200, headers: { 'Content-Type': 'application/json' } });
        }

        // Operations Insights
        if (url.includes('/api/gateway/operations-insights')) {
          return new Response(JSON.stringify({
            state: 'connected',
            rotationSeconds: 20,
            items: [
              {
                id: 'oi1',
                label: 'FLOCK ACTIVITY',
                value: '16 Active Flocks',
                headline: '16 Active Flocks',
                copy: 'All active flock record requirements published to public aggregates.',
                summary: 'All active flock record requirements published to public aggregates.',
                updatedAt: new Date().toISOString()
              }
            ]
          }), { status: 200, headers: { 'Content-Type': 'application/json' } });
        }

        // Spotlight
        if (url.includes('/api/gateway/spotlight')) {
          return new Response(JSON.stringify([
            {
              id: 'sp1',
              title: "Nigeria's Agricultural Sector Sees Opportunities for Growth",
              body: 'Discover how innovations and mechanization are transforming the sector in Osun State and nationwide.',
              category: 'OPPORTUNITY',
              author: 'Owner-managed content'
            }
          ]), { status: 200, headers: { 'Content-Type': 'application/json' } });
        }

        // Inspiration
        if (url.includes('/api/gateway/inspiration')) {
          return new Response(JSON.stringify([
            {
              id: 'in1',
              quote: 'Embracing innovation can lead to new income streams and improved agricultural practices.',
              author: 'DAENEM FARMS',
              tag: 'Agricultural Innovation'
            }
          ]), { status: 200, headers: { 'Content-Type': 'application/json' } });
        }

        return origFetch.apply(this, arguments);
      };
    })();
    </script>
    <script defer src="/approved-signin/stage05-enhancements.js"></script>
    <script defer src="/approved-signin/whatsapp-signup-bridge.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <style>
      /* Sign-In hero, headings, and primary buttons – Space Grotesk, sans-serif */
      h1, h2, h3,
      .font-signin-hero,
      .gw-signin-heading,
      .gw-hero-kicker,
      button[type="submit"],
      .gw-signin-btn,
      .btn-primary,
      .btn-brand,
      [data-slot="hero-title"],
      [data-slot="signin-title"] {
        font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif !important;
      }

      /* Sign-In form text and inputs – Inter Tight with Inter fallback, sans-serif */
      body, html,
      form,
      input,
      label,
      p,
      span,
      button,
      a,
      .gw-auth-form,
      .gw-auth-input,
      .gw-auth-label {
        font-family: 'Inter Tight', 'Inter', system-ui, -apple-system, sans-serif !important;
      }

      /* Primary buttons – Space Grotesk */
      button[type="submit"],
      .gw-signin-btn,
      .btn-primary,
      .btn-brand {
        font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif !important;
        font-weight: 600 !important;
      }
    </style>
    <link rel="stylesheet" crossorigin href="/approved-signin/assets/index-density-ce29569986b1.css">

    <div id="root"></div>
  </body>
</html>
